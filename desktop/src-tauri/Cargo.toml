[package]
name = "legado-desktop-shell"
version = "0.1.1"
description = "Legado Desktop Tauri shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-runtime = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
